name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serialize releases: concurrent merges to main must not race on tag creation.
# Do not cancel an in-flight release — let it finish, then run the next.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A push releases only when it adds a notes file. Every other push skips the
  # gate: its pull request's CI already passed the same tree, and rerunning
  # make check on each merge cost more minutes than the PR itself.
  version:
    # Releases come only from the public repo. A private copy merges the public
    # notes files when it syncs, and must not publish them again as its own.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      version_no_v: ${{ steps.version.outputs.version_no_v }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The pushed change releases the version whose notes it adds
          # (scripts/release-version.sh); the PR check already required it.
          version="$(bash scripts/release-version.sh "$BEFORE" "$GITHUB_SHA")"
          if [[ "$version" == "none" ]]; then
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "version_no_v=${version#v}" >>"$GITHUB_OUTPUT"

  release-gate:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Install Semgrep
        run: python3 -m pip install --user --require-hashes -r .github/requirements/semgrep.txt

      - name: Release gate
        run: /usr/bin/make release-check

  release:
    needs:
      - version
      - release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: 8.30.1

      - name: Install SBOM tool
        run: |
          set -euo pipefail
          # Outside the checkout: an untracked file there would stamp the
          # release binaries' build info as modified (+dirty).
          tools_bin="$RUNNER_TEMP/release-tools"
          mkdir -p "$tools_bin"
          # Version comes from tools/go.mod and is hash-verified by tools/go.sum,
          # so this IS pinned; Scorecard's Pinned-Dependencies text heuristic
          # cannot see go.sum-based pinning and flags this line — ignore it.
          cd tools && GOBIN="$tools_bin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod
          echo "$tools_bin" >>"$GITHUB_PATH"

      - name: Build release artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_NO_V: ${{ needs.version.outputs.version_no_v }}
        run: |
          set -euo pipefail
          mkdir -p dist
          commit="${GITHUB_SHA}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X zscalerctl/internal/version.version=${VERSION_NO_V} -X zscalerctl/internal/version.commit=${commit} -X zscalerctl/internal/version.date=${date}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            tagged_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "tag $VERSION already exists at $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          # cyclonedx-gomod v1.10.0 detects the main module version from Git.
          # Keep the release runner's remote tags untouched, but remove local
          # semver tags so annotated historical tags cannot confuse the detector.
          local_semver_tags="$(git tag --list 'v[0-9]*')"
          if [[ -n "$local_semver_tags" ]]; then
            while IFS= read -r tag; do
              git tag -d "$tag" >/dev/null
            done <<<"$local_semver_tags"
          fi
          git tag "$VERSION"
          cleanup() {
            git tag -d "$VERSION" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Go stamps vcs.modified from git status, so any changed or untracked
          # file left by an earlier step would ship binaries reporting +dirty.
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain >&2
            echo "release tree is not clean; refusing to build +dirty binaries" >&2
            exit 1
          fi

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [[ "$goos" == "windows" ]]; then
              ext=".exe"
            fi
            name="zscalerctl_${VERSION_NO_V}_${goos}_${goarch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -mod=vendor -trimpath -ldflags "$ldflags" -o "dist/$name/zscalerctl$ext" ./cmd/zscalerctl
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" cyclonedx-gomod app -json -licenses -main cmd/zscalerctl -output "dist/$name.sbom.cdx.json" .
            cp "dist/$name.sbom.cdx.json" "dist/$name/sbom.cdx.json"
            mkdir -p "dist/$name/docs" "dist/$name/man" "dist/$name/skills"
            cp LICENSE README.md AGENTS.md "dist/$name/"
            cp docs/INSTALL.md docs/VERSIONING.md "dist/$name/docs/"
            cp -R docs/schema "dist/$name/docs/schema"
            cp -R docs/cli "dist/$name/docs/cli"
            cp man/zscalerctl.1 "dist/$name/man/"
            cp -R skills/zscalerctl "dist/$name/skills/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
          done

          (cd dist && shasum -a 256 *.tar.gz *.sbom.cdx.json > SHA256SUMS)

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with cosign
        run: |
          set -euo pipefail
          # Keyless: signs with the job's OIDC identity (id-token: write) via
          # Sigstore — no long-lived keys. SHA256SUMS.sigstore.json covers every
          # release file through the SHA256SUMS subject list and is the
          # verification artifact (combined with the attest-build-provenance
          # attestations). .sigstore.json is the standard Sigstore bundle name
          # and the one OSSF Scorecard's Signed-Releases check recognizes; it
          # scored the old SHA256SUMS.bundle name 0/10 and never reads GitHub's
          # attestation store. Do NOT add --output-signature/--output-certificate:
          # cosign v4 deprecates and IGNORES those flags alongside --bundle
          # (confirmed empirically — they emit nothing).
          # Verify (see docs/INSTALL.md): cosign verify-blob
          #   --bundle SHA256SUMS.sigstore.json
          #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
          #   --certificate-identity-regexp '^https://github.com/<owner>/<repo>/\.github/workflows/release\.yml@'
          #   SHA256SUMS
          cd dist
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            tagged_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "tag $VERSION already exists at $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "$VERSION"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$VERSION"
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release already exists: $VERSION" >&2
            exit 1
          fi

          gh release create "$VERSION" dist/* --title "$VERSION" --notes-file "docs/releases/${VERSION}.md"
