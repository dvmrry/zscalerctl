name: release-notes

# A pull request either adds one docs/releases/vX.Y.Z.md notes file, which
# merging publishes as that release, or carries the no-release label. Branch
# protection requires this check, so nothing merges without that decision.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release decision
        env:
          NO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}
        run: |
          set -euo pipefail
          # The checkout is the PR merged into its base, so HEAD^1 is the base.
          version="$(bash scripts/release-version.sh HEAD^1 HEAD)"
          if [[ "$version" == "none" && "$NO_RELEASE" != "true" ]]; then
            echo "::error::add docs/releases/vX.Y.Z.md (the next version's notes) or the no-release label"
            exit 1
          fi
          if [[ "$version" != "none" && "$NO_RELEASE" == "true" ]]; then
            echo "::error::this change adds the notes for $version but carries the no-release label"
            exit 1
          fi
          echo "release decision: $version"
