name: osv

on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 11 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: false
      upload-sarif: false
      scan-args: |-
        --recursive
        ./
    permissions:
      actions: read
      security-events: write
      contents: read
