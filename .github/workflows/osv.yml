name: osv

on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 11 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      fail-on-vuln: false
      upload-sarif: false
      scan-args: |-
        --recursive
        ./
    permissions:
      actions: read
      security-events: write
      contents: read
